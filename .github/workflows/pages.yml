name: pages

# The public site: a hand-written landing page and getting-started page, the API reference built from the
# libraries' XML comments, and the gallery running in a browser.
#
# The three live under `site/`, `site/docs/` and `site/gallery/` respectively. `site/` is committed - it is a
# page of text about the library - while the other two are built from the checkout, so what they show is what
# the branch says; the reference is the same docfx build CI runs on every push, which is what keeps a broken
# `<see cref>` from reaching the site.
#
# The gallery is published the way its project says: trimmed, and compiled ahead of time. The wasm workload is
# what makes both possible, and what they are worth - the download, and the frame - is measured in the project
# and in the design brief rather than guessed at here.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One site at a time: a run that is still publishing when the next one starts is the one to drop.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    # GitHub only: Pages is GitHub's, and the Gitea instance reads these files too.
    if: github.server_url == 'https://github.com'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Build the API reference
        run: |
          dotnet build AvCharts.slnx -c Release
          dotnet tool restore
          dotnet docfx docs/docfx.json

      - name: Build the gallery for the browser
        # The settings are the project's own (`PublishTrimmed`, `RunAOTCompilation`, `CompressionEnabled`):
        # the gallery this job publishes is the gallery the project describes, and a publish made by hand is
        # the same one.
        run: |
          # Publishing into an existing directory leaves the previous run's fingerprinted assets behind;
          # they are not referenced, but they inflate the artifact and the upload.
          rm -rf artifacts/browser
          dotnet publish src/AvCharts.Demo.Browser/AvCharts.Demo.Browser.csproj -c Release -o artifacts/browser

      - name: Lay the site out
        run: |
          mkdir -p artifacts/site/docs artifacts/site/gallery
          cp -r site/. artifacts/site/
          cp -r artifacts/docs/. artifacts/site/docs/
          cp -r artifacts/browser/wwwroot/. artifacts/site/gallery/
          ls -la artifacts/site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
