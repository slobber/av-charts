name: release

# The release, and it lives here now: on a `v*` tag the two packages go to NuGet.org, and the tag gets a
# Release with the packages, their symbols and the gallery attached.
#
# The version is NBGV's - `version.json` and the git history - and only a `v*` tag is a public number, which is
# why nothing here passes `PackageVersion`.
#
# NuGet.org is reached by trusted publishing rather than by a stored key: this workflow asks GitHub for an OIDC
# token and exchanges it for an API key that lives for an hour, which is what the policy on nuget.org names.
# Three things have to line up with that policy, and all three are in this file: the repository and the
# workflow name it names, the `production` environment it names, and `id-token: write`, without which there is
# no token to exchange. (The policy covers both packages: its glob is `*`.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # The environment the nuget.org policy names, and the permission it needs to hand out a token.
    environment: production
    permissions:
      contents: write
      id-token: write

    # GitHub only: the Gitea instance reads `.github/workflows/` too, and this job talks to the GitHub API.
    if: github.server_url == 'https://github.com'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      # The golden-image tests render text, and a runner with no font fails them with "no font found".
      - name: Fonts for the headless renderer
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 fonts-dejavu

      # The gallery's browser head compiles ahead of time by default, which makes `wasm-tools` a requirement of
      # building the solution at all - measured in `ci.yml`, without it this stops at `error NETSDK1147` and the
      # release never gets as far as packing anything. This step is why the release could not publish: the
      # workflow was written before the browser head existed. `ci.yml` installs the same workload for the same
      # reason.
      - name: Install the workload that building the solution needs
        run: dotnet workload install wasm-tools

      - name: Build, test and pack
        run: |
          dotnet build AvCharts.slnx -c Release
          dotnet test src/AvCharts.Tests/AvCharts.Tests.csproj -c Release --no-build
          dotnet pack src/AvCharts/AvCharts.csproj -c Release --no-build -o artifacts
          dotnet pack src/AvCharts.Controls/AvCharts.Controls.csproj -c Release --no-build -o artifacts
          ls -1 artifacts

      - name: Publish the gallery for Windows
        run: |
          dotnet publish src/AvCharts.Demo.Desktop/AvCharts.Demo.Desktop.csproj -c Release \
            -r win-x64 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -o artifacts/gallery
          cp artifacts/gallery/AvChartsDemoDesktop.exe artifacts/

      # The token, good for an hour, minted against `user` - which is the nuget.org profile name, not the
      # GitHub login, though here they happen to be the same word.
      - name: Log in to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: slobber

      - name: Push to NuGet.org
        run: |
          for file in artifacts/AvCharts.[0-9]*.nupkg artifacts/AvCharts.Controls.[0-9]*.nupkg; do
            out=$(dotnet nuget push "$file" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" \
              --skip-duplicate 2>&1) || { echo "$out"; echo "::error::$file was not pushed"; exit 1; }

            echo "$out"

            # `--skip-duplicate` is what makes running a tag again harmless - a package that is already there is
            # not an error - and it is also what would let a push that quietly did nothing pass for one. The push
            # says which of the two happened, and anything else means the package did not go up.
            if ! grep -qE 'Created |already exists' <<< "$out"; then
              echo "::error::$file: the push neither published it nor found it published"
              exit 1
            fi
          done

      - name: Write the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag that already has a Release must not be moved: deleting a tag whose Release exists turns that
          # Release into a draft and leaves it without a tag, which is what happened to v0.1.1 while this workflow
          # was being fixed. Cut a new version instead of re-pointing a published tag.
          #
          # The digit in the patterns is what keeps one package's files out of the other's list: `AvCharts.*`
          # also matches `AvCharts.Controls.0.1.1.nupkg`, and handing the same file to the release twice fails
          # the upload with "already_exists" - which is what the run for v0.1.1 died of, after it had already
          # pushed the packages.
          files=(
            artifacts/AvCharts.[0-9]*.nupkg artifacts/AvCharts.[0-9]*.snupkg
            artifacts/AvCharts.Controls.[0-9]*.nupkg artifacts/AvCharts.Controls.[0-9]*.snupkg
            artifacts/AvChartsDemoDesktop.exe
          )

          # A tag can be re-run - a run that failed after the packages were published is the ordinary reason -
          # and the second run must not fall over the Release the first one wrote.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${files[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              "${files[@]}"
          fi
