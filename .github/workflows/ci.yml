name: ci

# Build, format-check, test and pack the two libraries and the gallery.
#
# - The version is worked out by NBGV from `version.json` and the git history, so the checkout has to be
#   full depth (a shallow clone fails outright);
# - the gallery targets net10.0 and is part of the solution, which is why the whole solution is built;
# - the gallery is compiled ahead of time when it is published (`RunAOTCompilation` in its project), and that
#   makes the `wasm-tools` workload a requirement of *building* the solution as well: measured, without it the
#   build stops at `error NETSDK1147: To build this project, the following workloads must be installed`. So
#   both jobs install it before they restore;
# - a slot for the private feed's credentials is kept, the same shape the rest of the org uses.
#
# Two jobs, because the golden images can only be compared on one platform: a picture is the rasterizer's
# output, and the same drawing through the same font comes out differently elsewhere (measured on a Linux
# runner: a quarter of the pixels of one page, the bold weight resolving to another face). Those tests skip
# themselves off Windows with the reason attached, and the `pictures` job is what keeps them checked.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check .NET SDK
        run: dotnet --version

      - name: Version report (NBGV)
        run: |
          dotnet tool install --global nbgv --version 3.10.94 > /dev/null
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "version: $(nbgv get-version -p . -v NuGetPackageVersion)"
          nbgv get-version -p . -v Version

      # Before anything builds the solution: see the note at the top of this file.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      # The API site is built on every run, so that a link the reference cannot resolve - a `<see cref>` that
      # names a type that moved, a file that is not there - is a failing build rather than something someone
      # finds when the site is finally published. Where it is published is still open; building it is not.
      - name: Build the API documentation
        run: |
          dotnet build AvCharts.slnx -c Release
          dotnet tool restore
          dotnet docfx docs/docfx.json
      # The headless renderer used by the golden-image tests needs fontconfig and at least one font,
      # otherwise the tests that measure ink fail with "no font found".
      - name: Install fonts for the headless renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 fonts-dejavu-core

      # A secret cannot be named in an `if:` - GitHub rejects the whole file ("Unrecognized named-value:
      # 'secrets'", ci.yml line 52) and creates the run with no jobs at all, which is what this workflow did on
      # every push it was ever given. The step reads its own environment instead, and stands down when the
      # credentials are not there; a host inside the org is what supplies them.
      - name: Configure private NuGet feed (optional)
        env:
          BAGET_USERNAME: ${{ secrets.BAGET_USERNAME }}
          BAGET_TOKEN: ${{ secrets.BAGET_TOKEN }}
        run: |
          if [ -z "$BAGET_USERNAME" ]; then
            echo "No feed credentials; the sources in nuget.config are enough."
            exit 0
          fi

          # nuget.config already names the source, so this step only supplies credentials on hosts that
          # need them; `add` would fail because the source name exists.
          dotnet nuget update source CyberStone \
            --username "$BAGET_USERNAME" \
            --password "$BAGET_TOKEN" \
            --store-password-in-clear-text

      - name: Restore
        run: dotnet restore AvCharts.slnx

      - name: Build (Release)
        run: dotnet build AvCharts.slnx --no-restore -c Release

      # The rules in `.editorconfig` are enforced at compile time by `EnforceCodeStyleInBuild`; this step
      # catches what the compiler cannot see (line endings, indentation, using order).
      - name: Format (.editorconfig)
        run: dotnet format AvCharts.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test src/AvCharts.Tests/AvCharts.Tests.csproj --no-build -c Release

      - name: Pack (Release)
        run: |
          dotnet pack src/AvCharts/AvCharts.csproj --no-build -c Release -o artifacts
          dotnet pack src/AvCharts.Controls/AvCharts.Controls.csproj --no-build -c Release -o artifacts

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: avcharts.${{ github.sha }}
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  pictures:
    # The golden images, on the one platform they were recorded on - so that a chart that moved by a pixel is
    # still a failing build rather than something a Windows machine finds a week later.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      # The same requirement as the other job's: see the note at the top of this file.
      - name: Install the wasm workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore AvCharts.slnx

      - name: Build (Release)
        run: dotnet build AvCharts.slnx --no-restore -c Release

      # By name rather than by trait: these are the classes that draw a picture and compare it.
      - name: Test (the pictures)
        run: dotnet test src/AvCharts.Tests/AvCharts.Tests.csproj --no-build -c Release --filter "FullyQualifiedName~GoldenTests|FullyQualifiedName~ShellTests"

      # What was drawn instead, when it was not what was expected: the difference, to be looked at.
      - name: Keep what was drawn instead
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pictures-received.${{ github.sha }}
          path: src/AvCharts.Tests/Golden/Received/
